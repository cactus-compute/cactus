[project]
name = "cactus"
version = "0.1.0"
description = "Cactus Python tools"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers>=5.8.0",
    "accelerate",
    "numpy",
    "huggingface-hub",
]

[project.optional-dependencies]
vlm = ["Pillow", "num2words", "torchvision"]
lora = ["peft"]

[project.scripts]
cactus = "cactus.cli:main"
cactus-hf-gemma-assistant = "cactus.hf_gemma_assistant:main"
cactus-hf-gemma-mtp-check = "cactus.hf_gemma_mtp_check:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cactus*"]
