name: publish-component

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - id: component
        run: |
          cactus download wasm-component --out .
          version=$(python3 -c "from cactus.agent.fetch import ENGINE_VERSION; print(ENGINE_VERSION)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository_owner }}/cactus-runtime-component" >> "$GITHUB_OUTPUT"
      - uses: oras-project/setup-oras@v1
      - uses: sigstore/cosign-installer@v3
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
      - id: push
        working-directory: wasm-component
        run: |
          image="${{ steps.component.outputs.image }}"
          version="${{ steps.component.outputs.version }}"
          digest=$(oras push "$image:$version,latest" \
            --artifact-type application/vnd.wasm.component.v1+wasm \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.version=$version" \
            --annotation "org.opencontainers.image.title=cactus.component.wasm" \
            --format go-template='{{.digest}}' \
            cactus.component.wasm:application/vnd.wasm.component.v1+wasm \
            cactus.wit:text/plain)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "published $image:$version@$digest"
      - run: cosign sign --yes "${{ steps.component.outputs.image }}@${{ steps.push.outputs.digest }}"
      - run: |
          cosign verify "${{ steps.component.outputs.image }}@${{ steps.push.outputs.digest }}" \
            --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
