<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="title description">
  <title id="title">Cactus Compute</title>
  <desc id="description">Sub-50mb Super Intelligence For Consumer Devices</desc>
  <style>
    .reveal { animation-duration: 10s; animation-iteration-count: infinite; animation-fill-mode: both; }
    .mark { animation-name: draw; animation-timing-function: cubic-bezier(.4, 0, .2, 1); }
    .word { animation-name: write; animation-timing-function: steps(14, end); }
    .line { animation-name: extend; transform-box: fill-box; transform-origin: left center; animation-timing-function: cubic-bezier(.2, .8, .2, 1); }
    .tagline { animation-name: appear; animation-timing-function: ease-out; }
    @keyframes draw {
      0%, 3% { stroke-dashoffset: 1; }
      27%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes write {
      0%, 12% { width: 0; }
      29%, 100% { width: 720px; }
    }
    @keyframes extend {
      0%, 27% { transform: scaleX(0); }
      36%, 100% { transform: scaleX(1); }
    }
    @keyframes appear {
      0%, 34% { opacity: 0; }
      41%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="wordmark">
      <rect class="reveal word" x="430" y="150" width="720" height="120"/>
    </clipPath>
  </defs>
  <rect width="1200" height="480" fill="#0e0e10"/>
  <g transform="translate(64 72) scale(.37)">
    <path class="reveal mark" d="M 272 848 L 272 545 C 272 534 262 530 222 530 A 190 190 0 0 1 32 340 L 32 170 A 64 64 0 0 1 160 170 L 160 340 C 160 372 187 399 219 399 L 272 399 L 272 207 A 175 175 0 0 1 623 207 L 623 620 C 623 645 640 655 665 655 L 736 655 L 736 432 A 64 64 0 0 1 864 432 L 864 640 A 163 163 0 0 1 701 803 L 655 803 C 636 803 623 815 623 835 L 623 848" fill="none" stroke="#ffffff" stroke-width="64" stroke-linejoin="round" stroke-linecap="butt" pathLength="1" stroke-dasharray="1"/>
  </g>
  <text x="430" y="248" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="82" font-weight="600" fill="#ffffff" letter-spacing="-2.5" clip-path="url(#wordmark)">Cactus Compute</text>
  <rect class="reveal line" x="430" y="274" width="690" height="3" fill="#e8593d"/>
  <text class="reveal tagline" x="430" y="322" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#aaa8a2">Sub-50mb Super Intelligence For Consumer Devices</text>
</svg>
